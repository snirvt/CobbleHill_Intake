[project]
name = "cobblehill-intake"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "langchain-core>=0.3",
    "langchain-ollama>=0.3",
    "liteparse>=1.2.1",
    "pydantic-settings>=2.14.1",
]

[project.scripts]
cobblehill = "classifier.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.0.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.12",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: tests requiring external services (deselect with '-m not integration')",
]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
